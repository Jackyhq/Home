name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'ci' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '10.19.0'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm test:unit

      - name: Check documentation links
        run: pnpm docs:check

      - name: Check and build
        run: pnpm build

      - name: Check build output
        shell: bash
        run: |
          if [ ! -f ./dist/index.html ]; then
            echo "Error: Chinese dist/index.html was not generated."
            exit 1
          fi
          if [ ! -f ./dist-en/index.html ]; then
            echo "Error: English dist-en/index.html was not generated."
            exit 1
          fi

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run browser tests against the production build
        run: pnpm test:e2e:dist

      - name: Run English localization tests
        run: pnpm test:e2e:en

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
